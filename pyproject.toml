[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-mie-prompt"
description = "Mie's prompt layer: the H3 and storyboard prompt templates, the external prompt loader, and the prompt families."
version = "0.2.1"
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "comfyui-mie-llm>=0.2.0",
]

[tool.setuptools]
packages = [
    "mie_prompt",
    "mie_prompt.prompts",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.package-data]
"mie_prompt.prompts" = ["h3/*", "h3_loop/*", "h3_storyboard/*", "qwen_image_21/*", "ideogram4/*", "bernini/*", "flux3_klein/*",
 "krea2/*", "ltx25/*", "scail2/*", "flux2/*", "flux_klein/*",
 "hunyuan/*", "kontext/*", "ltx2/*", "moss_image/*", "h3_image/*",
 "prompt_generator/*", "translator/*", "frame_transition/*", "zimage/*"]
